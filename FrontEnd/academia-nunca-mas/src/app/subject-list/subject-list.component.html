<div class="container mt-4">
  <h2 class="mb-4">Listado de Materias</h2>

  <!-- Mensaje de éxito -->
  <div *ngIf="successMessage" class="alert alert-success alert-dismissible fade show">
    {{ successMessage }}
    <button type="button" class="btn-close" (click)="successMessage = ''"></button>
  </div>

  <!-- Mensaje de error -->
  <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show">
    {{ errorMessage }}
    <button type="button" class="btn-close" (click)="errorMessage = ''"></button>
  </div>

  <!-- Spinner de carga -->
  <div *ngIf="isLoading" class="text-center my-4">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <!-- Lista de materias -->
  <div class="row">
    <div *ngFor="let subject of subjects" class="col-md-6 mb-4">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">{{ subject.name }} ({{ subject.code }})</h5>
          <p class="card-text">
            <strong>Profesor:</strong> {{ subject.teacher }}<br>
            <strong>Créditos:</strong> {{ subject.credits }}
          </p>
          
          <div *ngIf="subject.classmates.length > 0" class="mb-3">
            <h6>Compañeros en esta materia:</h6>
            <ul>
              <li *ngFor="let classmate of subject.classmates">{{ classmate }}</li>
            </ul>
          </div>

          <button 
            *ngIf="!subject.isSelected"
            class="btn btn-primary"
            (click)="assignSubject(subject.code)"
            [disabled]="isLoading">
            Asignar Materia
          </button>
          
          <div *ngIf="subject.isSelected" class="badge bg-success">
            Materia asignada
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
