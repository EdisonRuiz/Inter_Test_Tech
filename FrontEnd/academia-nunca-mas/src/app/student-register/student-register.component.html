<div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <h2 class="mb-4">Registro de Estudiante</h2>
        
        <!-- Mensaje de éxito -->
        <div *ngIf="successMessage" class="alert alert-success alert-dismissible fade show">
          {{ successMessage }}
          <button type="button" class="btn-close" (click)="successMessage = ''"></button>
        </div>
        
        <!-- Mensaje de error -->
        <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show">
          {{ errorMessage }}
          <button type="button" class="btn-close" (click)="errorMessage = ''"></button>
        </div>
  
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate>
          <div class="mb-3">
            <label for="name" class="form-label">Nombre completo</label>
            <input 
              type="text" 
              class="form-control" 
              id="name" 
              formControlName="name"
              [class.is-invalid]="registerForm.get('name')?.invalid && registerForm.get('name')?.touched">
            
            <div *ngIf="registerForm.get('name')?.invalid && registerForm.get('name')?.touched" class="invalid-feedback">
              <div *ngIf="registerForm.get('name')?.errors?.['required']">
                El nombre es requerido
              </div>
              <div *ngIf="registerForm.get('name')?.errors?.['minlength']">
                El nombre debe tener al menos 3 caracteres
              </div>
            </div>
          </div>
  
          <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input 
              type="email" 
              class="form-control" 
              id="email" 
              formControlName="email"
              [class.is-invalid]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
            
            <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="invalid-feedback">
              <div *ngIf="registerForm.get('email')?.errors?.['required']">
                El email es requerido
              </div>
              <div *ngIf="registerForm.get('email')?.errors?.['email']">
                Por favor ingresa un email válido
              </div>
            </div>
          </div>
  
          <button 
            type="submit" 
            class="btn btn-primary"
            [disabled]="registerForm.invalid || isLoading">
            <span *ngIf="!isLoading">Registrar</span>
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          </button>
        </form>
      </div>
    </div>
  </div>
